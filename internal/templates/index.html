<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <meta property="og:description" content="Lista de conteúdo sobre liderança técnica curada pelos membros da comunidade TechLeads.club">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/images/opengraph.png">

    <script>
        (() => {
            const getStoredTheme = () => {
                try {
                    return localStorage.getItem('theme');
                } catch {
                    return null;
                }
            };

            const persistTheme = (theme) => {
                try {
                    localStorage.setItem('theme', theme);
                } catch {
                    // Keep the visual theme change working even when storage is blocked.
                }
            };

            const getThemeMode = () => {
                const storedTheme = getStoredTheme();
                return ['light', 'dark', 'system'].includes(storedTheme) ? storedTheme : 'system';
            };

            const getResolvedTheme = (mode) => {
                if (mode === 'light' || mode === 'dark') {
                    return mode;
                }
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            };

            const themeModes = ['light', 'system', 'dark'];
            const themeNames = {
                system: 'sistema',
                light: 'claro',
                dark: 'escuro',
            };

            const syncThemeControls = (mode) => {
                document.querySelectorAll('[data-theme-cycle]').forEach((button) => {
                    const label = `Tema atual: ${themeNames[mode]}. Alternar tema.`;
                    button.setAttribute('aria-label', label);
                    button.setAttribute('title', label);

                    button.querySelectorAll('[data-theme-cycle-icon]').forEach((icon) => {
                        icon.toggleAttribute('hidden', icon.dataset.themeCycleIcon !== mode);
                    });
                });
            };

            const applyThemeMode = (mode, persist = false) => {
                const resolvedTheme = getResolvedTheme(mode);
                document.documentElement.classList.toggle('dark', resolvedTheme === 'dark');
                syncThemeControls(mode);

                if (persist) {
                    persistTheme(mode);
                }
            };

            applyThemeMode(getThemeMode());

            document.addEventListener('DOMContentLoaded', () => {
                syncThemeControls(getThemeMode());

                document.querySelectorAll('[data-theme-cycle]').forEach((button) => {
                    let lastPointerActivation = 0;
                    const cycleThemeOption = () => {
                        const currentMode = getThemeMode();
                        const nextMode = themeModes[(themeModes.indexOf(currentMode) + 1) % themeModes.length];
                        applyThemeMode(nextMode, true);
                    };

                    button.addEventListener('pointerdown', (event) => {
                        if (event.button !== undefined && event.button !== 0) {
                            return;
                        }

                        event.preventDefault();
                        lastPointerActivation = Date.now();
                        cycleThemeOption();
                        button.focus();
                    });

                    button.addEventListener('click', (event) => {
                        if (Date.now() - lastPointerActivation < 500) {
                            event.preventDefault();
                            return;
                        }

                        cycleThemeOption();
                    });
                });
            });

            const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
            const handleSystemThemeChange = (event) => {
                if (getThemeMode() === 'system') {
                    document.documentElement.classList.toggle('dark', event.matches);
                }
            };

            if (mediaQuery.addEventListener) {
                mediaQuery.addEventListener('change', handleSystemThemeChange);
            } else {
                mediaQuery.addListener(handleSystemThemeChange);
            }
        })();
    </script>

    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/js/all.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

    <link href="/css/main.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900 transition-colors duration-200 dark:bg-gray-950 dark:text-gray-100">
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('catalog', () => {
                const params = new URLSearchParams(window.location.search);
                
                return {
                    items: {{ .Items | toJson }},
                    filters: {{ .Filters | toJson }},

                    get filteredItems() {
                        return this.items.filter(item => {
                            const hasFilter = [];
                            if (this.currentFilters.language.size) {
                                hasFilter.push(this.currentFilters.language.has(item.Language));
                            }
                            if (this.currentFilters.isPaid.size) {
                                hasFilter.push(this.currentFilters.isPaid.has(String(item.IsPaid)));
                            }
                            if (this.currentFilters.level.size) {
                                hasFilter.push(this.currentFilters.level.has(item.Level));
                            }
                            if (this.currentFilters.type.size) {
                                hasFilter.push(this.currentFilters.type.has(item.Type));
                            }
                            if (this.currentFilters.tag.size) {
                                hasFilter.push(item.Tags.some(tag => this.currentFilters.tag.has(tag)));
                            }
                            return hasFilter.every(v => v);
                        })
                    },

                    get hasFilters() {
                        return Object.values(this.currentFilters).some(set => set.size);
                    },

                    currentFilters: {
                        tag: new Set(params.getAll('tag')),
                        type: new Set(params.getAll('type')),
                        level: new Set(params.getAll('level')),
                        language: new Set(params.getAll('language')),
                        isPaid: new Set(params.getAll('isPaid'))
                    }, 

                    handleChangeFilter(type, event) {
                        const value = event.target.value;
                        this.changeFilter(type, value);
                        event.target.value = '';
                    },

                    changeFilter(type, value) {
                        const alreadySelected = this.currentFilters[type].has(value);
                        if (alreadySelected) {
                            this.currentFilters[type].delete(value);
                        } else {
                            this.currentFilters[type].add(value);
                        }

                        this.updateFiltersOnURL();
                    },

                    updateFiltersOnURL() {
                        const params = new URLSearchParams();
                        for (const [key, values] of Object.entries(this.currentFilters)) {
                            values.forEach(value => params.append(key, value));
                        }
                        window.history.pushState(null, '', `?${params.toString()}`);
                    },

                    clearAllFilters() {
                        this.currentFilters = {
                            tag: new Set(),
                            type: new Set(),
                            level: new Set(),
                            language: new Set(),
                            isPaid: new Set()
                        };
                        this.updateFiltersOnURL();
                    },

                    formatFilter(key, value) {
                        switch (key) {
                            case "isPaid":
                                return this.formatIsPaid(value)
                            default:
                                return value
                        }
                    },

                    formatIsPaid(isPaid) {
                        return isPaid === "true" ? "Pago" : "Gratuito"
                    },
                    
                    excludeAlreadyFiltered(filters = [], key) {
                        return filters.filter(value => !this.currentFilters[key]?.has(value));
                    }
                }
            })
        })
    </script> 

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8" x-data="catalog">
        <div class="mb-6 flex justify-end">
            <button
                type="button"
                data-theme-cycle
                aria-label="Tema atual: sistema. Alternar tema."
                title="Tema atual: sistema. Alternar tema."
                class="inline-flex h-9 w-9 items-center justify-center rounded-md text-gray-600 transition-colors hover:bg-gray-100 hover:text-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-blue-300"
            >
                <svg class="pointer-events-none" data-theme-cycle-icon="light" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true" hidden>
                    <circle cx="12" cy="12" r="5"></circle>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
                </svg>
                <svg class="pointer-events-none" data-theme-cycle-icon="system" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="2" y="3" width="20" height="14" rx="2"></rect>
                    <path d="M8 21h8M12 17v4"></path>
                </svg>
                <svg class="pointer-events-none" data-theme-cycle-icon="dark" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true" hidden>
                    <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
                </svg>
            </button>
        </div>

        <article class="text-center mb-16 bg-gradient-to-b from-gray-50 to-white py-12 px-6 rounded-2xl border border-gray-100 transition-colors duration-200 dark:from-gray-950 dark:to-gray-900 dark:border-gray-800">
            <div class="flex justify-center mb-8">
                <img src="/images/awesome-tech-lead-logo.svg" 
                     alt="Awesome Tech Lead Logo" 
                     class="w-80 h-40 transition-transform duration-300 hover:scale-105">
            </div>
            <h2 class="text-xl text-gray-700 max-w-4xl mx-auto leading-relaxed mb-4 dark:text-gray-200">
                Lista de conteúdo sobre <span class="font-semibold text-blue-700 dark:text-blue-300">liderança técnica</span> curada pelos membros da comunidade <a href="https://techleads.club?utm_source=awesome-tech-lead&utm_medium=site" target="_blank" rel="noopener noreferrer" class="text-blue-600 hover:text-blue-800 font-semibold underline transition-colors dark:text-blue-300 dark:hover:text-blue-200">TechLeads.club</a> 💎
            </h2>
            <div class="mt-2">
                <div class="flex items-center justify-center">
                    <a
                        href="https://github.com/tech-leads-club/awesome-tech-lead"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="inline-flex items-center"
                    >
                        <img
                            alt="GitHub stars"
                            width="95"
                            height="30"
                            src="https://img.shields.io/github/stars/tech-leads-club/awesome-tech-lead?style=social"
                            class="transition-transform hover:scale-105"
                        />
                    </a>
                </div>
            </div>
        </article>

        <section class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mb-6 transition-colors duration-200 dark:bg-gray-900 dark:border-gray-800">
            <div class="flex flex-col md:flex-row md:items-center gap-4">
                <div class="flex items-center gap-3">
                    <i class="fas fa-filter text-blue-600 dark:text-blue-300"></i>
                    <span class="text-lg font-semibold text-gray-800 dark:text-gray-100">Filtros</span>
                    <template x-if="hasFilters">
                        <button @click="clearAllFilters()" class="inline-flex items-center gap-1 px-3 py-1 text-sm text-red-600 hover:text-red-800 hover:bg-red-50 rounded-md transition-colors dark:text-red-300 dark:hover:text-red-200 dark:hover:bg-red-950/50">
                            <i class="fas fa-times"></i>
                            <span>Limpar</span>
                        </button>
                    </template>
                </div>
                
                <div class="grid grid-cols-2 md:grid-cols-5 gap-3 flex-1">
                    <select
                        @change="handleChangeFilter('tag', $event)"
                        id="tag"
                        aria-label="Filtrar por tags"
                        class="appearance-none bg-gray-50 border border-gray-300 rounded-lg py-2.5 px-4 text-gray-700 cursor-pointer hover:bg-white hover:border-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all dark:bg-gray-950 dark:border-gray-700 dark:text-gray-100 dark:hover:bg-gray-900 dark:hover:border-blue-400 dark:focus:bg-gray-950"
                    >
                        <option value="">🏷️ Tags</option>
                        <template x-for="tag in excludeAlreadyFiltered(filters.Tags, 'tag')">
                            <option :value="tag" x-text="tag"></option>
                        </template>
                    </select>

                    <select 
                        @change="handleChangeFilter('type', $event)"
                        id="type"
                        aria-label="Filtrar por tipo"
                        class="appearance-none bg-gray-50 border border-gray-300 rounded-lg py-2.5 px-4 text-gray-700 cursor-pointer hover:bg-white hover:border-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all dark:bg-gray-950 dark:border-gray-700 dark:text-gray-100 dark:hover:bg-gray-900 dark:hover:border-blue-400 dark:focus:bg-gray-950"
                    >
                        <option value="">📄 Tipo</option>
                        <template x-for="type in excludeAlreadyFiltered(filters.Types, 'type')">
                            <option :value="type" x-text="type"></option>
                        </template>
                    </select>

                    <select 
                        @change="handleChangeFilter('level', $event)"
                        id="level"
                        aria-label="Filtrar por nível"
                        class="appearance-none bg-gray-50 border border-gray-300 rounded-lg py-2.5 px-4 text-gray-700 cursor-pointer hover:bg-white hover:border-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all dark:bg-gray-950 dark:border-gray-700 dark:text-gray-100 dark:hover:bg-gray-900 dark:hover:border-blue-400 dark:focus:bg-gray-950"
                    >
                        <option value="">📊 Nível</option>
                        <template x-for="level in excludeAlreadyFiltered(filters.Levels, 'level')">
                            <option :value="level" x-text="level"></option>
                        </template>
                    </select>

                    <select
                        @change="handleChangeFilter('language', $event)"
                        id="language"
                        aria-label="Filtrar por idioma"
                        class="appearance-none bg-gray-50 border border-gray-300 rounded-lg py-2.5 px-4 text-gray-700 cursor-pointer hover:bg-white hover:border-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all dark:bg-gray-950 dark:border-gray-700 dark:text-gray-100 dark:hover:bg-gray-900 dark:hover:border-blue-400 dark:focus:bg-gray-950"
                    >
                        <option value="">🌐 Idioma</option>
                        <template x-for="language in excludeAlreadyFiltered(filters.Languages, 'language')">
                            <option :value="language" x-text="language"></option>
                        </template>
                    </select>

                    <select 
                        @change="handleChangeFilter('isPaid', $event)"
                        id="isPaid"
                        aria-label="Filtrar por preço"
                        class="appearance-none bg-gray-50 border border-gray-300 rounded-lg py-2.5 px-4 text-gray-700 cursor-pointer hover:bg-white hover:border-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all dark:bg-gray-950 dark:border-gray-700 dark:text-gray-100 dark:hover:bg-gray-900 dark:hover:border-blue-400 dark:focus:bg-gray-950"
                    >
                        <option value="">💰 Preço</option>
                        <option :value="false">Gratuito</option>
                        <option :value="true">Pago</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="mt-4 flex flex-wrap gap-2 mb-4">
            <template x-for="(values, key) in currentFilters">
                <template x-for="value in Array.from(values)">
                    <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-sm bg-blue-100 text-blue-800 dark:bg-blue-950 dark:text-blue-200">
                        <span x-text="formatFilter(key, value)"></span>
                        <button @click="changeFilter(key, value)" class="cursor-pointer ml-1 text-blue-600 hover:text-blue-800 dark:text-blue-300 dark:hover:text-blue-100">
                            <i class="fas fa-times"></i>
                        </button>
                    </span>
                </template>
            </template>
        </section>

        <main class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <template
                x-for="(item, index) in filteredItems"
                :key="index"
            >
                <article class="bg-white rounded-lg shadow-sm p-6 flex flex-col hover:shadow-md transition duration-200 border border-gray-100 dark:bg-gray-900 dark:border-gray-800 dark:hover:border-gray-700">
                    <div class="flex items-start justify-between">
                        <h3 x-text="item.Title" class="text-lg font-semibold text-gray-900 dark:text-gray-100"></h3>
                        <span class="bg-blue-50 text-blue-800 text-xs font-medium px-2.5 py-0.5 rounded-full dark:bg-blue-950 dark:text-blue-200" x-text="item.IsPaid ? 'Pago' : 'Gratuito'"></span>
                    </div>
    
                    <p class="mt-1 text-sm text-gray-600 mb-2 dark:text-gray-400">Por <span x-text="item.Author"></span></p>
                    
                    <div class="flex flex-wrap gap-2 mt-auto mb-4">
                        <template x-for="tag in item.Tags">
                            <span class="bg-gray-100 text-gray-800 text-xs font-medium px-2.5 py-0.5 rounded-full dark:bg-gray-800 dark:text-gray-200" x-text="tag"></span>
                        </template>
                        <span class="bg-gray-100 text-gray-800 text-xs font-medium px-2.5 py-0.5 rounded-full dark:bg-gray-800 dark:text-gray-200" x-text="item.Type"></span>
                        <span class="bg-gray-100 text-gray-800 text-xs font-medium px-2.5 py-0.5 rounded-full dark:bg-gray-800 dark:text-gray-200" x-text="item.Level"></span>
                        <span class="bg-gray-100 text-gray-800 text-xs font-medium px-2.5 py-0.5 rounded-full dark:bg-gray-800 dark:text-gray-200" x-text="item.Language"></span>
                    </div>

                     <a 
                        :href="item.URL" 
                        target="_blank" 
                        rel="noopener noreferrer" 
                        class="mt-2 border border-blue-500 text-blue-800 px-4 py-2 text-sm rounded-lg w-full mt-auto text-center duration-200 hover:bg-blue-600 hover:text-white dark:border-blue-400 dark:text-blue-200 dark:hover:bg-blue-500 dark:hover:text-gray-950"
                    >
                        Ver Recurso
                    </a>
                </article>
            </template>
        </main>
    </div>
</body>
